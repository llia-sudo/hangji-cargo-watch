name: Diagnose LYG EDI sailing search

on:
  push:
    branches:
      - diag-lygedi-ten-jupiter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect sailing search form
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/diag.txt 2>&1
          import re, requests, html
          from urllib.parse import urljoin
          url='https://www.lygedi.com/SailingDate.html'
          s=requests.Session()
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          r=s.get(url,headers=headers,timeout=30)
          text=r.content.decode('utf-8','replace')
          print('PAGE_STATUS',r.status_code,'URL',r.url,'LEN',len(text))
          form_matches=list(re.finditer(r'<form\b[^>]*>.*?</form>',text,re.I|re.S))
          print('FORM_COUNT',len(form_matches))
          for i,m in enumerate(form_matches):
            block=m.group(0)
            tag=re.match(r'<form\b[^>]*>',block,re.I|re.S).group(0)
            print('\nFORM',i,tag)
            for elem in re.findall(r'<(?:input|select|option|button|textarea)\b[^>]*>',block,re.I|re.S):
              clean=re.sub(r'\s+',' ',elem)
              print(clean[:1000])
            plain=re.sub(r'<[^>]+>',' ',block)
            plain=html.unescape(re.sub(r'\s+',' ',plain))
            print('FORM_TEXT',plain[:5000])
          for needle in ['船名','航次','开航','查询','TEN JUPITER','SailingDate','Form1']:
            print('\nCONTEXT',needle)
            pos=0; count=0
            while True:
              pos=text.find(needle,pos)
              if pos<0 or count>=10: break
              print(re.sub(r'\s+',' ',text[max(0,pos-500):pos+1200]))
              pos += len(needle); count += 1
          PY
          cat /tmp/diag.txt
      - name: Publish diagnostic result branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan diag-lygedi-result
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/diag.txt diagnostic.txt
          git add diagnostic.txt
          git commit -m 'Publish LYG EDI diagnostic result'
          git push --force origin diag-lygedi-result
