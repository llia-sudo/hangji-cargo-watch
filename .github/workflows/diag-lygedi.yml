name: Diagnose LYG EDI sailing search

on:
  push:
    branches:
      - diag-lygedi-ten-jupiter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query planned and actual sailings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/diag.txt 2>&1
          import requests, re, html
          from urllib.parse import urljoin

          BASE='https://www.lygedi.com'
          HEADERS={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          s=requests.Session()

          def dec(content):
            for enc in ('utf-8','gb18030','gbk'):
              try:
                t=content.decode(enc)
                if '<html' in t.lower(): return t
              except Exception: pass
            return content.decode('utf-8','replace')

          def clean(x):
            x=re.sub(r'<script.*?</script>',' ',x,flags=re.I|re.S)
            x=re.sub(r'<style.*?</style>',' ',x,flags=re.I|re.S)
            x=re.sub(r'<[^>]+>',' ',x)
            return re.sub(r'\s+',' ',html.unescape(x)).strip()

          def attr(tag,name):
            m=re.search(r'\b'+re.escape(name)+r'\s*=\s*["\']([^"\']*)["\']',tag,re.I)
            return m.group(1) if m else ''

          def form_block(text):
            m=re.search(r'<form\b[^>]*name=["\']Form1["\'][^>]*>.*?</form>',text,re.I|re.S)
            if m: return m.group(0)
            forms=re.findall(r'<form\b[^>]*>.*?</form>',text,re.I|re.S)
            return forms[-1] if forms else ''

          def build_payload(form,vessel):
            fields=[]
            tags=re.findall(r'<input\b[^>]*>|<select\b[^>]*>.*?</select>|<textarea\b[^>]*>.*?</textarea>',form,re.I|re.S)
            for tag in tags:
              name=attr(tag,'name')
              if not name: continue
              if tag.lower().startswith('<select'):
                opts=re.findall(r'<option\b[^>]*>.*?</option>',tag,re.I|re.S)
                opt=next((o for o in opts if re.search(r'\bselected\b',o,re.I)),opts[0] if opts else '')
                value=attr(opt,'value') if opt else ''
              else:
                value=attr(tag,'value')
              fields.append((name,value))
            names=[n for n,_ in fields]
            text_fields=[]
            for n,_ in fields:
              if 'TextField' in n and n not in text_fields: text_fields.append(n)
            if '$TextField$1' in names:
              vessel_field='$TextField$1'
            elif '$TextField' in names and len(text_fields)==1:
              vessel_field='$TextField'
            else:
              vessel_field=text_fields[-1] if text_fields else None
            submit_candidates=[]
            for m in re.finditer(r'submitLink\(document\.Form1,&quot;([^&]+)&quot;\).*?>.*?查询',form,re.I|re.S):
              submit_candidates.append(html.unescape(m.group(1)))
            submit_value=submit_candidates[-1] if submit_candidates else '$LinkSubmit$1'
            payload=[]
            seen_select=set()
            for name,value in fields:
              if name==vessel_field: value=vessel
              if name=='_linkSubmit': value=submit_value
              payload.append((name,value))
            # Tapestry expects selects that may not have been captured cleanly.
            if 'propertySelection2' not in names: payload.append(('propertySelection2','-1'))
            if 'propertySelection1' not in names: payload.append(('propertySelection1',''))
            print('VESSEL_FIELD',vessel_field,'SUBMIT',submit_value)
            print('FIELD_NAMES',names)
            return payload

          def query(path):
            vessel='TEN JUPITER'
            url=urljoin(BASE,path)
            r=s.get(url,headers=HEADERS,timeout=30)
            text=dec(r.content)
            print('\n===',path,'GET',r.status_code,'LEN',len(text),'===')
            form=form_block(text)
            print('FORM_FOUND',bool(form),'FORM_TEXT',clean(form)[:2500])
            payload=build_payload(form,vessel)
            action=attr(re.match(r'<form\b[^>]*>',form,re.I|re.S).group(0),'action') if form else path
            pr=s.post(urljoin(r.url,action or path),headers={**HEADERS,'Referer':r.url},data=payload,timeout=30,allow_redirects=True)
            out=dec(pr.content)
            print('POST',pr.status_code,pr.url,'LEN',len(out),'HAS_TEN_JUPITER',vessel in out.upper())
            # rows containing vessel and header rows
            rows=re.findall(r'<tr\b[^>]*>.*?</tr>',out,re.I|re.S)
            for row in rows:
              txt=clean(row)
              if any(k in txt for k in ['计划到港时间','计划离港时间','实际到港','实际离港','实际开航','开航时间','船名（中/英）','航次(进口/出口)']):
                print('HEADER_OR_INFO',txt[:4000])
              if vessel in txt.upper():
                print('MATCH_ROW',txt[:5000])
            pos=out.upper().find(vessel)
            if pos>=0:
              print('CONTEXT',clean(out[max(0,pos-1800):pos+4500]))

          query('/SailingDate.html')
          query('/Sailing_ActDate.html')
          PY
          cat /tmp/diag.txt
      - name: Publish diagnostic result branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan diag-lygedi-result
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/diag.txt diagnostic.txt
          git add diagnostic.txt
          git commit -m 'Publish LYG EDI diagnostic result'
          git push --force origin diag-lygedi-result
