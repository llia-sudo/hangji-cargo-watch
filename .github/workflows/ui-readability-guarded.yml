name: Guarded UI readability refresh

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ui-readability-refresh-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply UI readability refresh
        run: |
          python scripts/apply-ui-readability-refresh.py
          python - <<'PY'
          from pathlib import Path
          for name in ["app/TrackerApp.tsx", "app/globals.css", "tests/cargo-watch.test.mjs"]:
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
      - run: npm ci
      - run: npm test
      - run: git diff --check
      - name: Commit guarded fix after tests
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/TrackerApp.tsx app/globals.css tests/cargo-watch.test.mjs
          git commit -m "Improve shipment UI readability"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
