name: PR build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded inland and delay UI fix
        if: ${{ github.event.pull_request.head.ref == 'fix/inland-delay-ui-20260818' }}
        run: |
          if [ -f scripts/apply-inland-delay-ui-fix.py ]; then
            python scripts/apply-inland-delay-ui-fix.py
          fi
      - run: npm ci
      - run: npm test
      - run: git diff --check
      - name: Commit guarded fix after tests
        if: ${{ github.event.pull_request.head.ref == 'fix/inland-delay-ui-20260818' }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix inland destination handling and delay labels"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
