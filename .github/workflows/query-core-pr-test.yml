name: PR build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.event.pull_request.head.ref == 'fix/query-core-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/final-query-safety.py
      - run: npm ci
      - run: npm test
      - name: Commit final tested safety adjustments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/carriers.ts app/lib/tracking.ts app/api/shipments/sync/route.ts tests/cargo-watch.test.mjs
          git commit -m "Refine learned routing and fallback persistence"
          git push origin HEAD:fix/query-core-20260818
