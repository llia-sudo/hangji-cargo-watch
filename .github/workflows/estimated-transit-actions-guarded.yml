name: Guarded estimated transit and action layout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/estimated-transit-actions-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply estimated transit and action layout patch
        run: python scripts/apply-estimated-transit-actions.py
      - run: npm ci
      - run: npm test
      - run: git diff --check
      - name: Commit guarded fix after tests
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/tracking.ts app/TrackerApp.tsx app/globals.css tests/cargo-watch.test.mjs
          git commit -m "Add estimated transit status and move order actions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
