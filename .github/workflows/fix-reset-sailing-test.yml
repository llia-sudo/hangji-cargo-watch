name: Temporary sailing reset patch test

on:
  push:
    branches:
      - fix-reset-sailing-on-change

permissions:
  contents: write

jobs:
  patch-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-reset-sailing-on-change
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch shipment edit reset logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/shipments/route.ts')
          s = p.read_text()

          replacements = [
            (
              '            status = ?,\n            baseline_etd = CASE\n              WHEN baseline_etd = \'\' AND ? <> \'\' THEN ?\n              ELSE baseline_etd\n            END,\n            etd = ?,',
              '            status = CASE WHEN ? = 1 THEN \'待查询\' ELSE ? END,\n            baseline_etd = CASE\n              WHEN ? = 1 THEN \'\'\n              WHEN baseline_etd = \'\' AND ? <> \'\' THEN ?\n              ELSE baseline_etd\n            END,\n            etd = CASE WHEN ? = 1 THEN \'\' ELSE ? END,'
            ),
            (
              '            baseline_eta = CASE\n              WHEN baseline_eta = \'\' AND ? <> \'\' THEN ?\n              ELSE baseline_eta\n            END,\n            eta = ?,\n            ata = CASE WHEN ? = 1 THEN \'\' ELSE ata END,\n            source = ?,',
              '            baseline_eta = CASE\n              WHEN ? = 1 THEN \'\'\n              WHEN baseline_eta = \'\' AND ? <> \'\' THEN ?\n              ELSE baseline_eta\n            END,\n            eta = CASE WHEN ? = 1 THEN \'\' ELSE ? END,\n            ata = CASE WHEN ? = 1 THEN \'\' ELSE ata END,\n            delay_days = CASE WHEN ? = 1 THEN 0 ELSE delay_days END,\n            source = CASE WHEN ? = 1 THEN \'手工录入\' ELSE ? END,'
            ),
            (
              '          row.portOfDischarge,\n          row.status,\n          row.etd,\n          row.etd,\n          row.etd,\n          sailingIdentityChanged ? 1 : 0,\n          sailingIdentityChanged ? 1 : 0,\n          sailingIdentityChanged ? 1 : 0,\n          row.eta,\n          row.eta,\n          row.eta,\n          sailingIdentityChanged ? 1 : 0,\n          row.source,',
              '          row.portOfDischarge,\n          sailingIdentityChanged ? 1 : 0,\n          row.status,\n          sailingIdentityChanged ? 1 : 0,\n          row.etd,\n          row.etd,\n          sailingIdentityChanged ? 1 : 0,\n          row.etd,\n          sailingIdentityChanged ? 1 : 0,\n          sailingIdentityChanged ? 1 : 0,\n          sailingIdentityChanged ? 1 : 0,\n          sailingIdentityChanged ? 1 : 0,\n          row.eta,\n          row.eta,\n          sailingIdentityChanged ? 1 : 0,\n          row.eta,\n          sailingIdentityChanged ? 1 : 0,\n          sailingIdentityChanged ? 1 : 0,\n          sailingIdentityChanged ? 1 : 0,\n          row.source,'
            ),
            (
              '      if (!result.meta.changes) {\n        return Response.json({ error: "订单信息没有保存" }, { status: 500 });\n      }\n\n      const { results } = await getD1().prepare(selectSql).all<{ id: number }>();',
              '      if (!result.meta.changes) {\n        return Response.json({ error: "订单信息没有保存" }, { status: 500 });\n      }\n\n      if (sailingIdentityChanged) {\n        await getD1()\n          .prepare("DELETE FROM shipment_schedule_history WHERE shipment_id = ?")\n          .bind(id)\n          .run();\n      }\n\n      const { results } = await getD1().prepare(selectSql).all<{ id: number }>();'
            ),
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected one match, found {count}: {old[:80]!r}')
            s = s.replace(old, new)

          p.write_text(s)
          PY
      - run: npm ci
      - run: npm test
      - name: Publish clean branch state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-reset-sailing-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/shipments/route.ts .github/workflows/fix-reset-sailing-test.yml
          git commit -m 'Reset stale schedules when sailing changes'
          git push origin HEAD:fix-reset-sailing-on-change
