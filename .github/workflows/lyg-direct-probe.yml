name: LYG Ferry direct query probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lyg-direct-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query TEN JUPITER 26360E
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          endpoint='https://cargo.lygferry.com/biz/scheduleViewList.do'
          referer='https://cargo.lygferry.com/biz/scheduleView.do'
          for direction in ['E','I']:
              master={'LINE_CD':'','ACTL_DT_FROM':'20260801','ACTL_DT_TO':'20261130','VSL_NM':'TEN JUPITER','VOYAGE_NO':'26360E','IO_KND_CD':direction,'POL':'','POD':'','rowType':'C'}
              payload={'url':'/biz/scheduleViewList.do','service':'scheduleViewList','serviceParam':json.dumps({'dataMaster':master},ensure_ascii=False,separators=(',',':')),'thisObj':'','targetGridObj':''}
              data=json.dumps(payload,ensure_ascii=False,separators=(',',':'))
              cp=subprocess.run(['curl','-L','--max-time','25','-sS','-w','\nHTTP_STATUS:%{http_code}\n','-H','Accept: application/json, text/javascript, */*; q=0.01','-H','Content-Type: application/json; charset=UTF-8','-H',f'Referer: {referer}','-H','User-Agent: Mozilla/5.0 CargoWatch/1.0','--data-binary','@-',endpoint],input=data,text=True,capture_output=True)
              print('\n=== DIRECTION',direction,'===')
              print('EXIT',cp.returncode)
              print(cp.stdout[:80000])
              if cp.stderr: print('STDERR',cp.stderr[:2000])
              body=cp.stdout.split('\nHTTP_STATUS:',1)[0]
              try:
                  parsed=json.loads(body)
                  print('TOP_KEYS',list(parsed.keys()) if isinstance(parsed,dict) else type(parsed).__name__)
                  def walk(obj,path='root'):
                      if isinstance(obj,dict):
                          txt=' '.join(str(v) for v in obj.values() if not isinstance(v,(dict,list)))
                          if 'TEN JUPITER' in txt.upper() or '26360E' in txt.upper():
                              print('MATCH',path,json.dumps(obj,ensure_ascii=False))
                          for k,v in obj.items(): walk(v,f'{path}.{k}')
                      elif isinstance(obj,list):
                          for i,v in enumerate(obj): walk(v,f'{path}[{i}]')
                  walk(parsed)
              except Exception as e:
                  print('PARSE_ERROR',repr(e))
          PY
