name: TEN JUPITER read-only replay audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read current order from D1 (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute hangji-cargo-watch --remote --json --command "SELECT id, order_no AS orderNo, carrier_id AS carrierId, preferred_query_source AS preferredQuerySource, vessel_name AS vesselName, voyage, bill_of_lading AS billOfLading, booking_no AS bookingNo, container_no AS containerNo, port_of_loading AS portOfLoading, port_of_discharge AS portOfDischarge, status, baseline_etd AS baselineEtd, etd, atd, baseline_eta AS baselineEta, eta, ata, delay_days AS delayDays, source, source_url AS sourceUrl, last_checked_at AS lastCheckedAt, notes, archived_at AS archivedAt, updated_at AS updatedAt FROM shipments WHERE order_no = '226GRD0771' LIMIT 1;" > ten-jupiter-d1.json

      - name: Create read-only replay harness
        run: |
          cat > ten-jupiter-audit-runner.ts <<'EOF'
          import fs from "node:fs";
          import { performance } from "node:perf_hooks";

          type AuditEvent = {
            id: number;
            label: string;
            method: string;
            url: string;
            startedMs: number;
            endedMs?: number;
            status?: number;
            error?: string;
            snippet?: string;
          };

          const raw = JSON.parse(fs.readFileSync("ten-jupiter-d1.json", "utf8"));
          const row = Array.isArray(raw)
            ? raw.flatMap((item: any) => item?.results ?? [])[0]
            : raw?.results?.[0];
          if (!row) throw new Error("D1 did not return order 226GRD0771");

          const originalFetch = globalThis.fetch.bind(globalThis);
          const start = performance.now();
          const events: AuditEvent[] = [];
          const bodyTasks: Promise<void>[] = [];
          let activeFetches = 0;
          let seq = 0;

          function labelFor(url: string) {
            if (url.includes("search.brave.com")) return "STEP 3 · Brave联网识别";
            if (url.includes("coscoshipping.com")) return "STEP 4 · COSCO官方源";
            if (url.includes("one-line.com")) return "STEP 4 · ONE官方源";
            if (url.includes("hmm21.com")) return "STEP 4 · HMM官方源";
            if (url.includes("yangming.com")) return "STEP 4 · Yang Ming官方源";
            if (url.includes("maersk.com")) return "STEP 4 · Maersk官方源";
            if (url.includes("sinolines.com")) return "STEP 4 · 中外运官方源";
            if (url.includes("pancon.co.kr")) return "后续/回退 · PANCON官方源";
            return "其他网络请求";
          }

          globalThis.fetch = (async (input: RequestInfo | URL, init?: RequestInit) => {
            const url = typeof input === "string"
              ? input
              : input instanceof URL
                ? input.toString()
                : input.url;
            const method = (init?.method || (typeof input !== "string" && !(input instanceof URL) ? input.method : "GET") || "GET").toUpperCase();
            const event: AuditEvent = {
              id: ++seq,
              label: labelFor(url),
              method,
              url,
              startedMs: Math.round(performance.now() - start),
            };
            events.push(event);
            activeFetches += 1;
            try {
              const response = await originalFetch(input as any, init);
              event.endedMs = Math.round(performance.now() - start);
              event.status = response.status;
              const task = response.clone().text().then((text) => {
                event.snippet = text.replace(/\s+/g, " ").slice(0, 1200);
              }).catch((error) => {
                event.snippet = `[body read failed: ${error instanceof Error ? error.message : String(error)}]`;
              });
              bodyTasks.push(task);
              return response;
            } catch (error) {
              event.endedMs = Math.round(performance.now() - start);
              event.error = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
              throw error;
            } finally {
              activeFetches -= 1;
            }
          }) as typeof fetch;

          const { detectCarrier } = await import("./app/lib/carriers.ts");
          const { syncShipment, createTrackingSession } = await import("./app/lib/tracking.ts");

          console.log("=== TEN JUPITER READ-ONLY REPLAY ===");
          console.log("D1 current row:");
          console.log(JSON.stringify(row, null, 2));
          console.log("\nSTEP 1/2 local detectCarrier result:");
          const localCarrier = detectCarrier(row);
          console.log(localCarrier ? JSON.stringify({ id: localCarrier.id, shortName: localCarrier.shortName }, null, 2) : "NO LOCAL MATCH");

          console.log("\nCalling existing syncShipment() WITHOUT database writeback...");
          const result = await syncShipment(row, createTrackingSession());
          console.log("\n=== syncShipment FINAL RESULT ===");
          console.log(JSON.stringify(result, null, 2));

          const waitStart = Date.now();
          while (activeFetches > 0 && Date.now() - waitStart < 20000) {
            await new Promise((resolve) => setTimeout(resolve, 250));
          }
          await Promise.allSettled(bodyTasks);

          console.log("\n=== ACTUAL NETWORK TRACE ===");
          for (const event of events) {
            const duration = event.endedMs === undefined ? "pending" : `${event.endedMs - event.startedMs}ms`;
            console.log(`\n#${event.id} [${event.label}] ${event.method} ${event.url}`);
            console.log(`start=${event.startedMs}ms duration=${duration} status=${event.status ?? "-"}${event.error ? ` error=${event.error}` : ""}`);
            if (event.snippet) console.log(`response=${event.snippet}`);
          }
          EOF

      - name: Replay current production logic without writeback
        run: |
          npm exec --yes --package=tsx@4 -- tsx ten-jupiter-audit-runner.ts
