name: Run guarded three-layer implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'deploy-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract guarded implementation script
        run: |
          git fetch origin deploy-audit
          git show origin/deploy-audit:.github/workflows/three-layer-carrier-implementation.yml > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/source.yml').read_text()
          marker = '      - name: Apply three-layer carrier architecture\n        run: |\n'
          end = '      - name: Install dependencies\n'
          if marker not in text or end not in text:
              raise SystemExit('implementation block not found')
          block = text.split(marker, 1)[1].split(end, 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-three-layer.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-three-layer.sh
      - run: npm ci
      - run: npm test
      - name: Commit exactly one functional commit
        run: |
          test "$(git rev-parse HEAD)" = "31588220fdc6598a6638d65376fe5fe83402efce"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/carriers.ts app/lib/online-carrier-identification.ts app/lib/tracking.ts tests/carrier-discovery.test.mjs
          git commit -m "Implement three-layer carrier discovery"
          test "$(git rev-list --count HEAD ^31588220fdc6598a6638d65376fe5fe83402efce)" = "1"
          git push origin HEAD:main
