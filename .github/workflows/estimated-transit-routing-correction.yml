name: Guarded estimated transit routing correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/estimated-transit-actions-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted carrier status correction
        run: python scripts/fix-estimated-transit-routing.py
      - run: npm ci
      - run: npm test
      - run: git diff --check
      - name: Commit correction after tests
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/tracking.ts tests/cargo-watch.test.mjs
          git commit -m "Unify estimated transit status across carrier queries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
