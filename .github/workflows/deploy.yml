name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        id: cloudflare_deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
      - name: Record deployment result
        if: ${{ always() }}
        env:
          DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
        run: |
          printf 'commit=%s\noutcome=%s\nrecorded_at=%s\n' "$GITHUB_SHA" "$DEPLOY_OUTCOME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployment-audit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-audit.txt
          git commit -m "Record deployment outcome for ${GITHUB_SHA}"
          git push --force origin HEAD:deploy-audit
