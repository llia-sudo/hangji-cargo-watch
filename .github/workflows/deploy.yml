name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        id: cloudflare_deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
      - name: Record deployment result on PR 1
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
        run: gh pr comment 1 --body "Deployment audit for commit ${GITHUB_SHA}: Cloudflare deploy outcome = ${DEPLOY_OUTCOME}."
